name: Deploy to bit-habit.com

# WHEN this runs:
on:
  push:
    branches: [master]      # every merge/push to master = a deploy
  workflow_dispatch: {}      # also lets you trigger it by hand from the Actions tab

# Never let two deploys run at once; if a new push lands mid-deploy,
# cancel the older run and ship the newest.
concurrency:
  group: deploy-static-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest   # the throwaway VM GitHub gives us to run the steps
    steps:
      # 1) Load the private deploy key into an ssh-agent for this run.
      #    The key comes from the encrypted repo secret; it's masked in logs.
      - name: Load deploy key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_KEY }}

      # 2) SSH into the server and fast-forward the static-web git clone.
      #    nginx serves that folder live (hostPath mount), so a pull IS the deploy —
      #    no image build, no pod restart. --ff-only refuses to deploy if history
      #    diverged (safer than a silent merge).
      - name: Pull latest on the server
        run: |
          ssh -o StrictHostKeyChecking=accept-new ubuntu@158.180.71.122 \
            'cd ~/workspace/static-web && git pull --ff-only origin master && git log --oneline -1'
